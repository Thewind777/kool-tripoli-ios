# KooiTripoli-iOS — CI/CD Configuration
# Pure SwiftUI project — no CocoaPods, no Flutter
# Primary branch: main
# CI/CD Provider: Codemagic
# ⚠️ This workflow was previously tested and pushed an app to TestFlight Internal.
#   The yaml is configured for a SwiftUI project — CocoaPods are NOT needed.

# ⚠️ REQUIRED: Configure 'kool_build_secrets' group on codemagic.io with 8 variables:
#   CM_CERTIFICATE            base64 of distribution .p12 certificate
#   CM_CERTIFICATE_PASSWORD   p12 password
#   CM_PROVISIONING_PROFILE   base64 of KooiTripoli_Dist.mobileprovision
#   APP_STORE_CONNECT_PRIVATE_KEY  base64 of ASC API key .p8
#   APP_STORE_CONNECT_KEY_IDENTIFIER  ASC API key ID
#   APP_STORE_CONNECT_ISSUER_ID  ASC API issuer ID
#   TEAM_ID                   Apple Developer Team ID (9FFXKQ75HM)
#   BUNDLE_ID                 com.kooi.tripoli
#   PROFILE_NAME              KooiTripoli Dist
#   SCHEME                    KooiTripoli

# ⚠️ IMPORTANT: cocoapods is set to "skip" — this is a pure SwiftUI project with no CocoaPods dependencies.

# Workflow: ios-release
# Instance type: mac_mini_m2
# Max build duration: 60 minutes
# Xcode: 16.4
# CocoaPods: skip (pure SwiftUI project - no pods needed)

workflows:
  ios-release:
    name: iOS Release (archive + export for TestFlight)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: 16.4
      groups:
        - kool_build_secrets
      vars:
        TEAM_ID: 9FFXKQ75HM
        BUNDLE_ID: com.kooi.tripoli
        PROFILE_NAME: KooiTripoli Dist
        SCHEME: KooiTripoli
        PROJECT_FILE: KooiTripoli.xcodeproj
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Set up code signing
        script: |
          set -e
          : "${CM_CERTIFICATE:?missing CM_CERTIFICATE}"
          : "${CM_CERTIFICATE_PASSWORD:?missing CM_CERTIFICATE_PASSWORD}"
          : "${CM_PROVISIONING_PROFILE:?missing CM_PROVISIONING_PROFILE}"

          keychain initialize

          echo "$CM_CERTIFICATE" | base64 --decode > /tmp/certificate.p12
          keychain add-certificates \
            --certificate /tmp/certificate.p12 \
            --certificate-password "$CM_CERTIFICATE_PASSWORD"

          echo "$CM_PROVISIONING_PROFILE" | base64 --decode > /tmp/profile.mobileprovision
          security cms -D -i /tmp/profile.mobileprovision > /tmp/profile.plist
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" /tmp/profile.plist)
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp /tmp/profile.mobileprovision \
             "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          rm -f /tmp/certificate.p12 /tmp/profile.mobileprovision /tmp/profile.plist

      - name: Verify signing assets
        script: |
          set -e
          echo "== Installed provisioning profiles =="
          ls -1 "$HOME/Library/MobileDevice/Provisioning Profiles" || true
          echo "== Keychain search list =="
          security list-keychains -d user
          echo "== All codesigning identities ==="
          security find-identity -p codesigning || true
          echo "== Valid codesigning identities ==="
          security find-identity -v -p codesigning || true
          security find-identity -p codesigning | grep -q "Apple Distribution" \
            || { echo "ERROR: no Apple Distribution identity in the keychain"; exit 1; }

      - name: Archive and export IPA
        script: |
          set -e
          cd "$CM_BUILD_DIR"
          BUILD_NUMBER=$(date -u +%y%m%d%H%M%S)
          echo "Build number: $BUILD_NUMBER"
          mkdir -p build/ios/xcarchive build/ios/ipa

          xcodebuild archive \
            -project "$PROJECT_FILE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$CM_BUILD_DIR/build/ios/xcarchive/KooiTripoli.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER"

          cat > /tmp/export-options.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>$TEAM_ID</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$BUNDLE_ID</key>
              <string>$PROFILE_NAME</string>
            </dict>
            <key>uploadSymbols</key>
            <true/>
            <key>stripSwiftSymbols</key>
            <true/>
          </dict>
          PLIST

          xcodebuild -exportArchive \
            -archivePath "$CM_BUILD_DIR/build/ios/xcarchive/KooiTripoli.xcarchive" \
            -exportPath "$CM_BUILD_DIR/build/ios/ipa" \
            -exportOptionsPlist /tmp/export-options.plist

          ls -lh build/ios/ipa

      - name: Upload to TestFlight
        script: |
          set -e
          cd "$CM_BUILD_DIR"
          : "${APP_STORE_CONNECT_PRIVATE_KEY:?missing APP_STORE_CONNECT_PRIVATE_KEY}"
          : "${APP_STORE_CONNECT_KEY_IDENTIFIER:?missing APP_STORE_CONNECT_KEY_IDENTIFIER}"
          : "${APP_STORE_CONNECT_ISSUER_ID:?missing APP_STORE_CONNECT_ISSUER_ID}"
          echo "$APP_STORE_CONNECT_PRIVATE_KEY" | base64 --decode > ~/AuthKey_$APP_STORE_CONNECT_KEY_IDENTIFIER.p8
          xcrun altool --upload-app \
            -f build/ios/ipa/*.ipa \
            -t ios \
            --apiKey "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"

    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/xcarchive/*.xcarchive
      - /tmp/xcodebuild_logs/*.log

# Notes:
# - This workflow skips CocoaPods entirely (pure SwiftUI project)
# - Build duration: ~15-20 minutes on mac_mini_m2 (no pod install)
# - Secret group 'kool_build_secrets' must be configured on codemagic.io
# - Distribution certificate and provisioning profile must be valid and not expired
# - Minimum iOS version: 15.0 (project targets 17.0, WebRTC-lib 137.0.0 requirement)